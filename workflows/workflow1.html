<!DOCTYPE html>
<html>
<head>
<title>Webscraping Workflow</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lunr.js/2.3.8/lunr.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:400,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">


  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #fff;
    }

    /* KEEP PAGE WIDTH NORMAL (fixes earlier issue) */
    body {
      width: 100%;
      margin: 0;
    }

    h1 {
      margin: 16px;
      font-size: 28px;
    }

    /* TOP MENU (unchanged style, simplified placement-safe) */
    .top-menu {
      width: 100%;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #ddd;
      box-sizing: border-box;
    }

    .top-menu-home a {
      background: #000;
      color: #fff;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      text-decoration: none;
    }

    .top-menu-links a {
      color: #000;
      text-decoration: none;
      font-weight: bold;
    }

    /* VIEWPORT */
    .viewport {
      width: 100%;
      height: 80vh; /* not full-screen chaos, but large enough */
      overflow: hidden;
      position: relative;
      background: #f5f5f5;
      cursor: grab;
      border-top: 1px solid #ddd;
    }

    .viewport:active {
      cursor: grabbing;
    }

    .content {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
    }

    object {
      display: block;
      pointer-events: none;
    }

    .controls {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 10;
    }

    button {
      margin-left: 5px;
      padding: 6px 10px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<!-- TOP MENU -->
<div class="top-menu" aria-label="Main navigation">
  <div class="top-menu-home">
    <a href="../index.html">Home</a>
  </div>
  <div class="top-menu-links">
    <a href="../Tutorials/Tutorials%20Homepage.html">Tutorials</a>
    <a href="../SearchGitHub.html">Repositories</a>
    <a href="..pathways/pathway-home.html">Pathways</a>
    <a href="../research-adaptation.html">Research Adaptation</a>
    <a  href="workflowHome.html">Workflows</a>
  </div>
</div>

<h1>Webscraping</h1>

<!-- VIEWER -->
<div class="viewport" id="viewport">

  <div class="controls">
    <button onclick="zoom(1.1)">+</button>
    <button onclick="zoom(0.9)">−</button>
    <button onclick="fitToScreen()">Fit</button>
    <button onclick="resetView()">Reset</button>
  </div>

  <div class="content" id="content">
    <object id="svgObj" data="svg/Webscraping.svg" type="image/svg+xml"></object>
  </div>

</div>

<script>
let scale = 0.3;   // 👈 IMPORTANT: start zoomed OUT
let x = 0;
let y = 0;

const viewport = document.getElementById("viewport");
const content = document.getElementById("content");
const svgObj = document.getElementById("svgObj");

function update() {
  content.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
}

function zoom(factor) {
  scale *= factor;
  scale = Math.min(Math.max(scale, 0.1), 8);
  update();
}

function resetView() {
  scale = 0.3;  // 👈 keeps it small (fixes your “too big start” issue)
  x = 0;
  y = 0;
  update();
}

/* =========================
   RELIABLE FIT TO SCREEN
========================= */
function fitToScreen() {
  const rect = viewport.getBoundingClientRect();

  const svg = svgObj.contentDocument?.documentElement;

  if (!svg || !svg.viewBox?.baseVal?.width) {
    setTimeout(fitToScreen, 100);
    return;
  }

  const vb = svg.viewBox.baseVal;

  const scaleX = rect.width / vb.width;
  const scaleY = rect.height / vb.height;

  scale = Math.min(scaleX, scaleY) * 0.9;

  x = 0;
  y = 0;

  update();
}

/* PAN */
let isDown = false;
let startX, startY;

viewport.addEventListener("mousedown", (e) => {
  isDown = true;
  startX = e.clientX - x;
  startY = e.clientY - y;
});

viewport.addEventListener("mousemove", (e) => {
  if (!isDown) return;
  x = e.clientX - startX;
  y = e.clientY - startY;
  update();
});

viewport.addEventListener("mouseup", () => isDown = false);
viewport.addEventListener("mouseleave", () => isDown = false);

/* ZOOM WHEEL */
viewport.addEventListener("wheel", (e) => {
  e.preventDefault();
  zoom(e.deltaY < 0 ? 1.1 : 0.9);
});

update();
</script>

</body>
</html>
